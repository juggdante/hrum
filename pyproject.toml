[project]
name = "hrum"
version = "0.1.0"
description = "HRUM - HR Unified Monitoring & Intelligence"
requires-python = ">=3.11"
dependencies = [
  "pandas", "pyarrow", "numpy", "requests", "pyyaml", "python-dotenv",
  "duckdb>=1.1",
  "dbt-duckdb",
  "sqlglot",            # SQL validation in guardrails
  "jsonschema",         # tool-argument validation
  "openai",             # OpenAI-compatible client for vLLM
]

[project.optional-dependencies]
ml = ["scikit-learn", "xgboost", "shap", "mlflow"]
rag = ["sentence-transformers", "torch"]   # torch listed so the CPU source below applies
agent = ["mcp==2.3.0", "pyjwt[crypto]", "langfuse", "streamlit", "plotly", "anthropic"]
bigquery = ["google-cloud-bigquery", "db-dtypes", "dbt-bigquery"]
dev = ["pytest", "ruff"]
# vLLM is installed in its own venv (it pins torch): see infra/local_server/README.md

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "agent*", "ingestion*", "ml*", "evals*", "infra*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

# The app only needs torch for the small embedding model (CPU is enough); the GPU belongs to vLLM, which has its
# own venv and its own CUDA torch. The CPU build keeps installs small and identical on the laptop and the GPU PC.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
