version: 2

sources:
  - name: raw
    schema: raw
    description: Data loaded as-is by ingestion/ (all VARCHAR for SF Comp).
    tables:
      - name: sf_employee_compensation
        description: >
          SF Employee Compensation (data.sfgov.org 88g8-5mnd, PDDL 1.0). REAL data.
          Contains `Employee Name` (PII) - must not leave the staging layer as text.
      - name: synthetic_hris
        description: >
          SYNTHETIC HRIS snapshot generated by ingestion/synthetic/generate.py, anchored to
          real FY department/job/comp. Every row is_synthetic = true.
