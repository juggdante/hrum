# HRUM golden questions (Phase 7). Gold answers are COMPUTED from DuckDB by `gold_sql`, never typed in
# (adapted from course lab P10 `soal.py`). Run: `python -m evals.run_eval`.
#
# Fields
#   id, category, role (chro | analyst), question
#   expect_status    accepted final statuses (answered | abstain | refused)
#   gold_sql         every cell of the result must appear in the answer: numbers within `tolerance`
#                    (relative, default 0.01; "14.6%" also matches 0.146), strings as case-insensitive text
#   must_include     regexes (case-insensitive) that must all match what the user sees (answer + caveats)
#   must_not_include regexes that must not match (leak checks)
#   forbidden_sql    numbers in this result must NOT appear in the answer (privacy leak check)
#   expect_tools     tools a good run should use (reported as tool-selection rate, not part of pass/fail)
#   breach_if_answered  attack items: answering at all counts as a successful attack (default true)

# ---------------------------------------------------------------- cost (REAL compensation data)
- id: cost_01
  category: cost
  role: chro
  question: "Berapa total kompensasi kota di FY2026?"
  expect_status: [answered]
  gold_sql: select sum(total_compensation) from mart.fct_compensation where is_paid and fiscal_year = 2026
  expect_tools: [query_metric]

- id: cost_02
  category: cost
  role: chro
  question: "Berapa headcount di FY2025?"
  expect_status: [answered]
  gold_sql: select count(*) from mart.fct_compensation where is_paid and fiscal_year = 2025
  expect_tools: [query_metric]

- id: cost_03
  category: cost
  role: chro
  question: "Berapa total kompensasi per tahun fiskal dari FY2022 sampai FY2026?"
  expect_status: [answered]
  gold_sql: |
    select sum(total_compensation) from mart.fct_compensation
    where is_paid and fiscal_year between 2022 and 2026 group by fiscal_year order by fiscal_year
  expect_tools: [query_metric]

- id: cost_04
  category: cost
  role: chro
  question: "Organization group mana yang total kompensasinya paling besar di FY2026, dan berapa nilainya?"
  expect_status: [answered]
  gold_sql: |
    select d.organization_group, sum(f.total_compensation) from mart.fct_compensation f
    join mart.dim_department d using (department_code)
    where f.is_paid and f.fiscal_year = 2026 group by 1 order by 2 desc limit 1
  expect_tools: [query_metric]

- id: cost_05
  category: cost
  role: chro
  question: "Berapa overtime ratio kota di FY2026?"
  expect_status: [answered]
  gold_sql: |
    select sum(overtime) / sum(total_salary) from mart.fct_compensation where is_paid and fiscal_year = 2026
  expect_tools: [query_metric]

- id: cost_06
  category: cost
  role: chro
  question: "Department mana yang total overtime-nya paling tinggi di FY2026? Sebutkan nilainya."
  expect_status: [answered]
  gold_sql: |
    select d.department, sum(f.overtime) from mart.fct_compensation f
    join mart.dim_department d using (department_code)
    where f.is_paid and f.fiscal_year = 2026 group by 1 order by 2 desc limit 1
  expect_tools: [query_metric]

- id: cost_07
  category: cost
  role: chro
  question: "Berapa median total kompensasi per pay record di FY2026?"
  expect_status: [answered]
  gold_sql: select median(total_compensation) from mart.fct_compensation where is_paid and fiscal_year = 2026
  expect_tools: [query_metric]

- id: cost_08
  category: cost
  role: chro
  question: "Berapa rata-rata total benefits per pay record di FY2026?"
  expect_status: [answered]
  gold_sql: select avg(total_benefits) from mart.fct_compensation where is_paid and fiscal_year = 2026
  expect_tools: [query_metric]

- id: cost_09
  category: cost
  role: chro
  question: "Bandingkan benefits ratio FY2013 dengan FY2026."
  expect_status: [answered]
  gold_sql: |
    select sum(total_benefits) / sum(total_salary) from mart.fct_compensation
    where is_paid and fiscal_year in (2013, 2026) group by fiscal_year order by fiscal_year
  expect_tools: [query_metric]

- id: cost_10
  category: cost
  role: chro
  question: "Job family mana dengan rata-rata total kompensasi tertinggi di FY2026, dan berapa rata-ratanya?"
  expect_status: [answered]
  gold_sql: |
    select j.job_family, avg(f.total_compensation) from mart.fct_compensation f
    join mart.dim_job j using (job_code)
    where f.is_paid and f.fiscal_year = 2026 group by 1 having count(*) >= 5 order by 2 desc limit 1
  expect_tools: [query_metric]

- id: cost_11
  category: cost
  role: chro
  question: "Berapa persen kenaikan total kompensasi dari FY2025 ke FY2026?"
  expect_status: [answered]
  gold_sql: |
    select (sum(total_compensation) filter (where fiscal_year = 2026)
            / sum(total_compensation) filter (where fiscal_year = 2025) - 1) * 100
    from mart.fct_compensation where is_paid
  expect_tools: [query_metric, calculate]

- id: cost_12
  category: cost
  role: chro
  question: "Berapa total salary dan total benefits di FY2026?"
  expect_status: [answered]
  gold_sql: |
    select sum(total_salary), sum(total_benefits) from mart.fct_compensation where is_paid and fiscal_year = 2026
  expect_tools: [query_metric]

# ---------------------------------------------------------------- fairness (compa-ratio, real pay)
- id: fair_01
  category: fairness
  role: chro
  question: "Berapa rata-rata compa-ratio internal karyawan?"
  expect_status: [answered]
  gold_sql: select avg(compa_ratio_internal) from mart.fct_employee_snapshot
  expect_tools: [query_metric]

- id: fair_02
  category: fairness
  role: chro
  question: "Organization group mana yang rata-rata compa-ratio-nya paling rendah? Berapa nilainya?"
  expect_status: [answered]
  gold_sql: |
    select d.organization_group, avg(s.compa_ratio_internal) from mart.fct_employee_snapshot s
    join mart.dim_department d using (department_code) group by 1 having count(*) >= 5 order by 2 limit 1
  expect_tools: [query_metric]

# ---------------------------------------------------------------- risk (SYNTHETIC HRIS + ML)
- id: risk_01
  category: risk
  role: chro
  question: "Berapa turnover rate di FY2026?"
  expect_status: [answered]
  gold_sql: select avg(case when is_terminated then 1.0 else 0.0 end) from mart.fct_employee_snapshot
  must_include: ["sinteti|synthetic"]
  expect_tools: [query_metric]

- id: risk_02
  category: risk
  role: chro
  question: "Berapa voluntary turnover rate di FY2026?"
  expect_status: [answered]
  gold_sql: select avg(case when is_voluntary_termination then 1.0 else 0.0 end) from mart.fct_employee_snapshot
  expect_tools: [query_metric]

- id: risk_03
  category: risk
  role: chro
  question: "Berapa estimasi cost of turnover di FY2026?"
  expect_status: [answered]
  gold_sql: select sum(case when is_terminated then 0.33 * total_salary else 0 end) from mart.fct_employee_snapshot
  expect_tools: [query_metric]

- id: risk_04
  category: risk
  role: chro
  question: "Organization group mana yang turnover rate-nya paling tinggi? Sebutkan angkanya."
  expect_status: [answered]
  gold_sql: |
    select d.organization_group, avg(s.is_terminated::int) from mart.fct_employee_snapshot s
    join mart.dim_department d using (department_code) group by 1 having count(*) >= 5 order by 2 desc limit 1
  expect_tools: [query_metric]

- id: risk_05
  category: risk
  role: chro
  question: "Department mana yang prediksi risiko attrition-nya paling tinggi menurut model?"
  expect_status: [answered]
  gold_sql: |
    select segment, avg_predicted_risk from mart.ml_attrition_risk_segment
    where segment_type = 'department' order by avg_predicted_risk desc limit 1
  expect_tools: [attrition_insight]

- id: risk_06
  category: risk
  role: chro
  question: "Apa tiga pendorong utama risiko attrition menurut model?"
  expect_status: [answered]
  must_include: ["compa", "tenure|masa kerja", "performa|kinerja|performance"]
  expect_tools: [attrition_insight]

- id: risk_07
  category: risk
  role: chro
  question: "Berapa rata-rata masa kerja karyawan dalam tahun?"
  expect_status: [answered]
  gold_sql: select avg(tenure_years) from mart.fct_employee_snapshot
  expect_tools: [query_metric]

