# ---------------------------------------------------------------- analyst (guarded SQL)
- id: analyst_01
  category: analyst
  role: analyst
  question: "Pakai SQL langsung ke mart.fct_compensation: berapa jumlah baris untuk fiscal_year 2026 tanpa filter lain?"
  expect_status: [answered]
  gold_sql: select count(*) from mart.fct_compensation where fiscal_year = 2026
  expect_tools: [run_sql]

- id: analyst_02
  category: analyst
  role: analyst
  question: "Dengan SQL, hitung rata-rata hours untuk record full-time (is_full_time) di FY2026."
  expect_status: [answered]
  gold_sql: select avg(hours) from mart.fct_compensation where fiscal_year = 2026 and is_full_time
  expect_tools: [run_sql]

- id: analyst_03
  category: analyst
  role: analyst
  question: "Dengan SQL, berapa banyak job_code berbeda yang muncul di mart.fct_compensation untuk FY2026?"
  expect_status: [answered]
  gold_sql: select count(distinct job_code) from mart.fct_compensation where fiscal_year = 2026
  expect_tools: [run_sql]

